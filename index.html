<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Milyoner Olmak İster? - Sitcom & Ardıç Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .btn-option {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 2px solid #374151;
            transition: all 0.2s ease;
        }
        .btn-option:hover:not(:disabled) {
            border-color: #facc15;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }
        .btn-option.selected {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            border-color: #fef08a;
            color: #fff;
            animation: pulse 1s infinite;
        }
        .btn-option.correct {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%) !important;
            border-color: #86efac !important;
            color: #fff !important;
        }
        .btn-option.wrong {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%) !important;
            border-color: #fca5a5 !important;
            color: #fff !important;
        }

        .money-step { transition: all 0.3s ease; }
        .money-step.active {
            background: linear-gradient(90deg, #ca8a04 0%, #eab308 100%);
            color: #000;
            font-weight: 800;
            transform: scale(1.05);
            border-radius: 6px;
            padding-left: 10px;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
        }
        .money-step.passed { color: #9ca3af; opacity: 0.5; }
        .money-step.safe { color: #38bdf8; font-weight: 700; }
        .money-step.active.safe { color: #000; }

        .confetti {
            position: fixed;
            width: 14px;
            height: 14px;
            z-index: 9999;
            pointer-events: none;
            animation: fall linear forwards;
            border: 1px solid #333;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .bjk-fan-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 75px;
            height: 75px;
            background: #111827;
            border: 3px solid #dc2626;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9), 0 0 15px rgba(220, 38, 38, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding-bottom: 2px;
        }
        .bjk-fan-btn:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.9), 0 0 35px rgba(255,255,255,0.4);
            border-color: #fff;
        }
        .fan-avatar-head {
            width: 26px;
            height: 26px;
            background: #fcd34d;
            border-radius: 50%;
            border: 2px solid #000;
            position: relative;
            z-index: 2;
            margin-bottom: -4px;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);
        }
        .fan-avatar-head::before {
            content: '';
            position: absolute;
            top: -4px; left: -2px; width: 26px; height: 12px;
            background: #000;
            border-radius: 10px 10px 0 0;
            border-bottom: 2px solid #fff;
        }
        .fan-avatar-jersey {
            width: 54px;
            height: 38px;
            background: repeating-linear-gradient(90deg, #000 0px, #000 10px, #fff 10px, #fff 20px);
            border-radius: 10px 10px 0 0;
            border: 2px solid #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 0 #dc2626;
        }
        .fan-avatar-jersey::after {
            content: '1903';
            background: #dc2626;
            color: #fff;
            font-size: 8px;
            font-weight: 900;
            padding: 1px 3px;
            border-radius: 2px;
            letter-spacing: 0.5px;
        }

        .celebrate-text {
            position: fixed;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 10px #dc2626, 0 0 20px #000, 0 0 30px #dc2626;
            pointer-events: none;
            z-index: 9998;
            animation: floatBanner 2s forwards ease-out;
        }
        @keyframes floatBanner {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-30px) scale(1.1); }
            80% { opacity: 1; transform: translateY(-100px) scale(1); }
            100% { opacity: 0; transform: translateY(-150px) scale(0.8); }
        }

        .lang-btn {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: #eab308;
            color: #000;
            font-weight: 800;
            border-color: #facc15;
        }
    </style>
</head>
<body class="flex flex-col justify-between relative">

    <!-- SOL ÜST DİL SEÇİMİ -->

        <button onclick="setLanguage('TR')" id="lang-TR" class="lang-btn active px-3 py-1 rounded-lg text-xs md:text-sm font-bold flex items-center space-x-1">

        <button onclick="setLanguage('DE')" id="lang-DE" class="lang-btn px-3 py-1 rounded-lg text-xs md:text-sm font-bold flex items-center space-x-1 text-gray-300">
            <span>🇩🇪 DE</span>
        </button>
    </div>

    <!-- SAĞ ALT BEŞİKTAŞ FORMALI TARAFTAR BUTONU -->

        <div class="fan-avatar-jersey"></div>

    <!-- ANA İÇERİK ALANI -->

        <!-- 1. EKRAN: LOBİ -->

            </h1>

            <div class="mb-10">
                <label id="ui-select-label" class="block text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Oynamak İstediğin Temayı Seç:</label>
                <div class="inline-block relative w-full max-w-md">
                    <select id="category-select" class="w-full bg-gray-900/90 text-yellow-400 border-2 border-yellow-500/50 rounded-xl px-5 py-4 font-bold text-lg focus:outline-none focus:border-yellow-400 transition cursor-pointer shadow-inner">

                        <option value="Tarih & Medeniyet">📜 Tarih & Medeniyet</option>
                        <option value="Genel Kültür">💡 Genel Kültür</option>
                        <option value="Spor & Oyun">⚽ Spor & Oyun</option>

                </div>
            </div>

            <button onclick="startGame()" id="ui-start-btn" class="w-full max-w-md bg-gradient-to-r from-yellow-500 via-amber-500 to-yellow-600 hover:from-yellow-400 hover:to-amber-500 text-gray-950 font-black py-5 px-8 rounded-xl text-2xl uppercase tracking-wider shadow-lg hover:shadow-yellow-500/30 transition transform hover:-translate-y-1 active:translate-y-0">
                <i class="fa-solid fa-play mr-2"></i> Yarışmaya Başla
            </button>
        </div>

        <!-- 2. EKRAN: OYUN EKRANI -->
        <div id="screen-game" class="w-full max-w-6xl hidden grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Sol ve Orta: Soru Alanı -->
            <div class="lg:col-span-3 flex flex-col justify-between glass-panel rounded-2xl p-6 md:p-8 relative border-t-2 border-yellow-500/30">
                
                <!-- Üst Bilgi Barı & Jokerler -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-800">
                    <div class="flex items-center space-x-3">

                    </div>

                    <!-- Joker Butonları -->
                    <div class="flex items-center space-x-2">

                        </button>
                        <button id="joker-phone" onclick="useJokerPhone()" title="Telefon Jokeri" class="bg-gray-800 hover:bg-gray-700 border border-yellow-500/40 text-yellow-400 font-extrabold w-10 h-10 rounded-full flex items-center justify-center transition shadow-md">

                        </button>
                        <button id="joker-2x" onclick="useJoker2X()" title="2X Jokeri" disabled class="bg-gray-900 border border-gray-700 text-gray-600 font-extrabold w-10 h-10 rounded-full flex items-center justify-center transition cursor-not-allowed">

                        </button>

                </div>

                <!-- Soru Metni -->

                    </h2>
                </div>

                <!-- Şıklar -->

                    <button id="btn-0" onclick="selectOption(0)" class="btn-option rounded-xl p-4 text-left font-semibold flex items-center text-sm md:text-base">
                        <span class="text-yellow-400 font-bold mr-3 orbitron text-lg">A:</span>
                        <span id="text-0" class="flex-grow">Seçenek A</span>
                    </button>
                    <button id="btn-1" onclick="selectOption(1)" class="btn-option rounded-xl p-4 text-left font-semibold flex items-center text-sm md:text-base">
                        <span class="text-yellow-400 font-bold mr-3 orbitron text-lg">B:</span>
                        <span id="text-1" class="flex-grow">Seçenek B</span>
                    </button>
                    <button id="btn-2" onclick="selectOption(2)" class="btn-option rounded-xl p-4 text-left font-semibold flex items-center text-sm md:text-base">
                        <span class="text-yellow-400 font-bold mr-3 orbitron text-lg">C:</span>
                        <span id="text-2" class="flex-grow">Seçenek C</span>
                    </button>
                    <button id="btn-3" onclick="selectOption(3)" class="btn-option rounded-xl p-4 text-left font-semibold flex items-center text-sm md:text-base">
                        <span class="text-yellow-400 font-bold mr-3 orbitron text-lg">D:</span>
                        <span id="text-3" class="flex-grow">Seçenek D</span>
                    </button>
                </div>

            </div>

            <!-- Sağ: Para Ağacı -->
            <div class="glass-panel rounded-2xl p-6 flex flex-col justify-between border-t-2 border-yellow-500/30 order-first lg:order-last">
                <h3 id="ui-tree-title" class="text-sm font-bold uppercase tracking-wider text-gray-400 border-b border-gray-800 pb-2 mb-3 text-center orbitron">
                    Para Ağacı
                </h3>
                <div id="money-list" class="flex flex-col-reverse justify-between flex-grow text-sm font-semibold space-y-1 space-y-reverse">
                    <!-- Javascript ile dinamik dolacak -->
                </div>
                <button onclick="withdrawMoney()" id="ui-withdraw-btn" class="mt-4 w-full bg-red-600/80 hover:bg-red-600 border border-red-400/30 text-white font-bold py-2.5 px-4 rounded-xl transition text-xs md:text-sm uppercase tracking-wider shadow">
                    <i class="fa-solid fa-sack-dollar mr-1"></i> Çekil ve Parayı Al
                </button>
            </div>

        </div>

        <!-- 3. EKRAN: SONUÇ -->
        <div id="screen-result" class="w-full max-w-xl hidden glass-panel rounded-2xl p-8 text-center border-t-4 border-yellow-500 shadow-2xl">
            <div id="result-icon" class="text-6xl mb-4">🏆</div>
            <h2 id="result-title" class="text-3xl font-extrabold text-white mb-2">TEBRİKLER!</h2>
            <p id="result-desc" class="text-gray-300 text-sm md:text-base mb-6">Harika bir yarışma çıkardın.</p>
            
            <div class="bg-gray-900/80 rounded-xl p-6 border border-yellow-500/30 mb-8">
                <span id="ui-won-prize" class="text-xs uppercase tracking-widest text-gray-400 block mb-1 font-bold">Kazanılan Ödül</span>
                <span id="result-prize" class="text-4xl font-black text-yellow-400 orbitron">5.000.000 TL</span>
            </div>

            <button onclick="location.reload()" id="ui-play-again" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-950 font-black py-4 px-8 rounded-xl text-lg uppercase tracking-wider shadow-lg transition">
                <i class="fa-solid fa-rotate-right mr-2"></i> Yeniden Oyna
            </button>
        </div>

    </main>

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active', 'text-black');
                btn.classList.add('text-gray-300');
            });
            const activeBtn = document.getElementById(`lang-${lang}`);
            activeBtn.classList.add('active', 'text-black');
            activeBtn.classList.remove('text-gray-300');

            updateUI();
        }

        function updateUI() {
            const d = DICTIONARY[currentLang];
            document.getElementById('ui-title').innerHTML = d.title;
            document.getElementById('ui-select-label').innerHTML = d.selectLabel;
            document.getElementById('ui-start-btn').innerHTML = d.startBtn;
            document.getElementById('ui-tree-title').innerHTML = d.treeTitle;
            document.getElementById('ui-withdraw-btn').innerHTML = d.withdrawBtn;
            document.getElementById('ui-won-prize').innerHTML = d.wonPrize;
            document.getElementById('ui-play-again').innerHTML = d.playAgain;

            const selectEl = document.getElementById('category-select');
            const currentVal = selectEl.value;
            selectEl.innerHTML = '';
            for (let key in d.cats) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = d.cats[key];

    <!-- ZIRHLI SES VE EFEKT YÖNETİMİ -->
    <script>
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'select') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'cheer') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }

        function handleBGM(action) {
            const bgm = document.getElementById('bgm-player');
            if (!bgm) return;
            try {
                if (action === 'play') {
                    bgm.volume = 0.25;
                    bgm.play().catch(() => {});
                } else if (action === 'pause') {
                    bgm.pause();
                } else if (action === 'stop') {
                    bgm.pause();
                    bgm.currentTime = 0;
                }
            } catch(e) {}
        }

        function celebrateBJK(btn) {
            playSound('cheer');
            for (let i = 0; i < 70; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = Math.random() > 0.5 ? '#000000' : '#ffffff';
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }

            const slogans = ["🦅 SİYAH!", "🤍 BEYAZ!", "🖤 ŞAMPİYON BEŞİKTAŞ!", "🔥 ÇARŞI 1903!", "🦅 EN BÜYÜK KARTAL!"];
            const chosen = slogans[Math.floor(Math.random() * slogans.length)];
            
            const banner = document.createElement('div');
            banner.className = 'celebrate-text';
            banner.innerText = chosen;
            banner.style.left = (Math.random() * 50 + 20) + 'vw';
            banner.style.top = (Math.random() * 40 + 30) + 'vh';
            document.body.appendChild(banner);

            setTimeout(() => banner.remove(), 2000);
        }
    </script>

            { c: "Coğrafya", l: 12, a: 3, q_tr: "Dünya üzerinde herhangi bir kara parçasına en uzak olan coğrafi nokta kabul edilen ve Büyük Okyanus ortasında yer alan okyanus erişilmezlik noktasına ne ad verilir?", q_de: "Wie nennt man den Punkt im Pazifischen Ozean, der von jedem Festland und jeder Insel der Erde am weitesten entfernt ist?", o_tr: ["Sıfır Noktası", "Atlantis Çukuru", "Bermuda Şeytan Üçgeni", "Nemo Noktası"], o_de: ["Nullpunkt", "Atlantis Graben", "Bermuda Dreieck", "Point Nemo"] },
            { c: "Biyoloji & Bilim", l: 12, a: 0, q_tr: "Kapalı bir sistemdeki düzensizlik ölçüsü olan entropinin zamanla sürekli artacağını belirterek evrenin nihai Isı Ölümüne gideceğini öngören fizik yasası hangisidir?", q_de: "Welches physikalische Gesetz besagt, dass die Entropie in einem geschlossenen System niemals abnimmt, und prognostiziert den Wärmetod des Universums?", o_tr: ["Termodinamiğin İkinci Yasası", "Termodinamiğin Üçüncü Yasası", "Hubble Yasası", "Boyle Mariotte Yasası"], o_de: ["Zweiter Hauptsatz der Thermodynamik", "Dritter Hauptsatz der Thermodynamik", "Hubble Gesetz", "Boyle Mariotte Gesetz"] },
            { c: "Edebiyat & Yazarlar", l: 13, a: 1, q_tr: "Amerikalı bilimkurgu yazarı Ursula K Le Guin tarafından yazılan, Anarres ile Urras adlı iki farklı gezegen üzerinden anarşizm ve kapitalizmi kıyasladığı felsefi başyapıt hangisidir?", q_de: "Wie heißt der philosophische Science Fiction Weltroman von Ursula K Le Guin, der die Gesellschaften der Planeten Anarres und Urras vergleicht?", o_tr: ["Karanlığın Sol Eli", "Mülksüzler", "Yerdeniz Büyücüsü", "Dünyaya Orman Denir"], o_de: ["Die linke Hand der Dunkelheit", "Die Enteigneten", "Der Magier von Erdsee", "Das Wort für Welt ist Wald"] },
            { c: "Matematik & Mantık", l: 13, a: 0, q_tr: "Oyun teorisinde, bir oyuncunun diğer oyuncuların stratejilerini bildiği varsayımı altında, stratejisini tek taraflı değiştirerek durumunu iyileştiremediği denge durumuna hangi Nobel ödüllü matematiçinin adı verilmiştir?", q_de: "Nach welchem Nobelpreisträger ist im Bereich der Spieltheorie ein Gleichgewichtszustand benannt, bei dem kein Spieler durch einseitiges Abweichen gewinnen kann?", o_tr: ["John Nash", "John von Neumann", "Albert Einstein", "Richard Feynman"], o_de: ["John Nash", "John von Neumann", "Albert Einstein", "Richard Feynman"] },
            { c: "Genel Kültür", l: 14, a: 0, q_tr: "Ludwig Wittgenstein tarafından kaleme alınan, Dilimin sınırları dünyamın sınırlarıdır sözünü içeren ve Üzerine konuşulamayan konusunda susmalı cümlesiyle biten yedi temel önermelik eser hangisidir?", q_de: "Wie heißt das aus sieben Hauptsätzen bestehende Werk von Ludwig Wittgenstein, das mit dem Satz endet Wovon man nicht sprechen kann, darüber muss man schweigen?", o_tr: ["Tractatus Logico Philosophicus", "Felsefi Soruşturmalar", "Kesinlik Üzerine", "Mavi ve Kahverengi Kitaplar"], o_de: ["Tractatus logico philosophicus", "Philosophische Untersuchungen", "Über Gewissheit", "Das Blaue und das Braune Buch"] },
            { c: "Biyoloji & Bilim", l: 14, a: 3, q_tr: "Uzayda bir kara deliğin etrafında, yerçekimi gücünün o kadar muazzam olduğu ve ışık dahil hiçbir maddenin kaçamadığı o teorik sınıra ne ad verilir?", q_de: "Wie nennt man die Grenzfläche um ein Schwarzes Loch, ab der die Gravitation so extrem ist, dass nichts, nicht einmal Licht, mehr entkommen kann?", o_tr: ["Tekillik", "Yığılma Diski", "Ergosfer", "Olay Ufku"], o_de: ["Singularität", "Akkretionsscheibe", "Ergosphäre", "Ereignishorizont"] },
            { c: "Matematik & Mantık", l: 15, a: 0, q_tr: "Asal sayıların dağılımını açıklamak için ortaya atılan, Zeta fonksiyonunun sıfırlarıyla ilgili olan ve günümüzün en büyük çözülememiş matematik problemi sayılan hipotez hangisidir?", q_de: "Wie heißt die unbewiesene Vermutung über die Nullstellen der Zeta Funktion, die die Verteilung der Primzahlen beschreibt und als eines der Millennium Probleme gilt?", o_tr: ["Riemann Hipotezi", "Goldbach Kestirimi", "Collatz Sanısı", "Poincare Sanısı"], o_de: ["Riemannsche Vermutung", "Goldbachsche Vermutung", "Collatz Problem", "Poincare Vermutung"] },
            { c: "Mitoloji Efsaneleri", l: 15, a: 2, q_tr: "İskandinav mitolojisinde dokuz diyarın tamamını dalları ve kökleri arasında birbirine bağlayan efsanevi evrensel dev hayat ağacının adı nedir?", q_de: "Wie heißt in der nordischen Mythologie die riesige Weltenesche, die als Weltenbaum den Kosmos verkörpert und alle neun Welten verbindet?", o_tr: ["Valhalla", "Asgard", "Yggdrasil", "Bifrost"], o_de: ["Walhall", "Asgard", "Yggdrasil", "Bifrost"] }
        ];

        let currentLevel = 1;
        let selectedCategory = "Karışık";
        let currentQuestion = null;
        let timer = null;
        let timeLeft = 30;
        let isLocked = false;
        let isJoker2XActive = false;
        let joker2XChances = 2;
        let categoryCounts = {};

        function renderMoneyTree() {
            const list = document.getElementById('money-list');
            list.innerHTML = '';
            MONEY_TREE.forEach(item => {
                const div = document.createElement('div');
                div.id = `tree-${item.level}`;
                div.className = `money-step py-1 px-2 flex justify-between items-center ${item.safe ? 'safe' : ''}`;
                div.innerHTML = `<span>${item.level}.</span><span>${item.amount}</span>`;
                list.appendChild(div);
            });
        }

        function startGame() {
            playSound('select');
            selectedCategory = document.getElementById('category-select').value;
            currentLevel = 1;
            categoryCounts = {};

            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('screen-game').classList.add('grid');

            renderMoneyTree();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isLocked = false;
            isJoker2XActive = false;
            
            document.querySelectorAll('.money-step').forEach(el => el.classList.remove('active'));
            const currentTreeEl = document.getElementById(`tree-${currentLevel}`);
            if(currentTreeEl) currentTreeEl.classList.add('active');

            if (currentLevel >= 8) {
                const j2x = document.getElementById('joker-2x');
                j2x.disabled = false;
                j2x.classList.remove('bg-gray-900', 'border-gray-700', 'text-gray-600', 'cursor-not-allowed');
                j2x.classList.add('bg-gray-800', 'hover:bg-gray-700', 'border-yellow-500/40', 'text-yellow-400', 'cursor-pointer', 'shadow-md');
            }

            if (currentLevel >= 11) {
                const jArdic = document.getElementById('joker-ardic');
                jArdic.disabled = false;
                jArdic.classList.remove('bg-gray-900', 'border-gray-700', 'text-gray-600', 'cursor-not-allowed');
                jArdic.classList.add('bg-gray-800', 'hover:bg-gray-700', 'border-yellow-500/40', 'text-yellow-400', 'cursor-pointer', 'shadow-md');
            }

            const d = DICTIONARY[currentLang];
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.className = 'btn-option rounded-xl p-4 text-left font-semibold flex items-center text-sm md:text-base cursor-pointer';
                btn.disabled = false;
                btn.style.visibility = 'visible';
            }

            let pool = RAW_QUESTIONS.filter(q => q.l === currentLevel);
            
            if (selectedCategory !== "Karışık") {
                pool = pool.filter(q => q.c === selectedCategory);
            } else {
                pool = pool.filter(q => {
                    let limit = 3;
                    if (q.c === "Müzik & Sanat" || q.c === "Yabancı Sitcom") limit = 2;
                    if (q.c === "Türk Sineması") limit = 1;
                    return (categoryCounts[q.c] || 0) < limit;
                });
            }

            if (pool.length === 0) pool = RAW_QUESTIONS.filter(q => q.l === currentLevel);
            if (pool.length === 0) pool = RAW_QUESTIONS;

            const randomIndex = Math.floor(Math.random() * pool.length);
            currentQuestion = pool[randomIndex];
            
            categoryCounts[currentQuestion.c] = (categoryCounts[currentQuestion.c] || 0) + 1;

            document.getElementById('game-category-badge').innerText = d.cats[currentQuestion.c] || currentQuestion.c;
            document.getElementById('question-number-badge').innerText = `${d.questionPrefix} ${currentLevel}/15`;
            document.getElementById('question-text').innerText = currentLang === 'TR' ? currentQuestion.q_tr : currentQuestion.q_de;

            for(let i=0; i<4; i++) {
                document.getElementById(`text-${i}`).innerText = currentLang === 'TR' ? currentQuestion.o_tr[i] : currentQuestion.o_de[i];
            }

            if (currentLevel <= 7) {
                document.getElementById('timer-box').classList.remove('hidden');
                startTimer(30);
            } else {
                document.getElementById('timer-box').classList.add('hidden');
                clearInterval(timer);
            }
        }

        function startTimer(seconds) {
            clearInterval(timer);
            timeLeft = seconds;
            document.getElementById('timer-text').innerText = timeLeft;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    gameOver(DICTIONARY[currentLang].timeUp);
                }
            }, 1000);
        }

        function selectOption(index) {
            if (isLocked) return;
            playSound('select');

            const btn = document.getElementById(`btn-${index}`);
            btn.classList.add('selected');

            if (isJoker2XActive) {
                if (index === currentQuestion.a) {
                    isLocked = true;
                    isJoker2XActive = false;
                    clearInterval(timer);
                    setTimeout(() => handleCorrect(btn), 1000);
                } else {
                    btn.classList.remove('selected');
                    btn.classList.add('wrong');
                    btn.disabled = true;
                    playSound('wrong');
                    joker2XChances--;
                    if (joker2XChances === 0) {
                        isLocked = true;
                        isJoker2XActive = false;
                        clearInterval(timer);
                        setTimeout(() => gameOver(DICTIONARY[currentLang].wrongAns), 1000);
                    }
                }
                return;
            }

            isLocked = true;
            clearInterval(timer);
            setTimeout(() => {
                if (index === currentQuestion.a) {
                    handleCorrect(btn);
                } else {
                    btn.classList.remove('selected');
                    btn.classList.add('wrong');
                    document.getElementById(`btn-${currentQuestion.a}`).classList.add('correct');
                    playSound('wrong');
                    setTimeout(() => gameOver(DICTIONARY[currentLang].wrongAns), 1500);
                }
            }, 1500);
        }

        function handleCorrect(btn) {
            btn.classList.remove('selected');
            btn.classList.add('correct');
            playSound('correct');

            setTimeout(() => {
                if (currentLevel === 15) {
                    showResult("5.000.000 TL", true);
                } else {
                    currentLevel++;
                    loadNextQuestion();
                }
            }, 1500);
        }

        function useJoker50() {
            if (isLocked) return;
            playSound('select');
            document.getElementById('joker-50').disabled = true;
            document.getElementById('joker-50').classList.add('opacity-30', 'cursor-not-allowed');

            let wrongIndices = [0, 1, 2, 3].filter(i => i !== currentQuestion.a);
            wrongIndices.sort(() => Math.random() - 0.5);
            
            for(let i=0; i<2; i++) {
                const hiddenBtn = document.getElementById(`btn-${wrongIndices[i]}`);
                hiddenBtn.style.visibility = 'hidden';
                hiddenBtn.disabled = true;
            }
        }

        function useJokerAudience() {
            if (isLocked) return;
            playSound('select');
            const btn = document.getElementById('joker-audience');
            btn.disabled = true;
            btn.classList.add('opacity-30', 'cursor-not-allowed');
            
            const labels = ["A", "B", "C", "D"];
            let audienceVotes = [5, 5, 5, 5];
            audienceVotes[currentQuestion.a] += 55;
            for(let i = 0; i < 25; i++) audienceVotes[Math.floor(Math.random() * 4)]++;

            const d = DICTIONARY[currentLang];
            alert(`${d.audienceTitle}\n\n` + 
                  `A: %${audienceVotes[0]} | B: %${audienceVotes[1]} | C: %${audienceVotes[2]} | D: %${audienceVotes[3]}\n\n` + 
                  d.audienceDesc.replace("[ANS]", labels[currentQuestion.a]));
        }

        function useJokerPhone() {
            if (isLocked) return;
            playSound('select');
            const btn = document.getElementById('joker-phone');
            btn.disabled = true;
            btn.classList.add('opacity-30', 'cursor-not-allowed');

            const labels = ["A", "B", "C", "D"];
            const isSure = Math.random() > 0.2;
            const d = DICTIONARY[currentLang];
            const template = isSure ? d.phoneSure : d.phoneUnsure;
            
            alert(template.replace("[ANS]", labels[currentQuestion.a]));
        }

        function useJoker2X() {
            if (isLocked || currentLevel < 8) return;
            playSound('select');
            isJoker2XActive = true;
            joker2XChances = 2;
            
            const btn = document.getElementById('joker-2x');
            btn.disabled = true;
            btn.classList.add('opacity-30', 'cursor-not-allowed');
            btn.classList.remove('border-yellow-500/40', 'text-yellow-400');
        }

        function useJokerArdic() {
            if (isLocked || currentLevel < 11) return;
            playSound('select');
            const btn = document.getElementById('joker-ardic');
            btn.disabled = true;
            btn.classList.add('opacity-30', 'cursor-not-allowed');
            btn.classList.remove('border-yellow-500/40', 'text-yellow-400');

            alert(DICTIONARY[currentLang].ardicText);
        }

        function withdrawMoney() {
            if (isLocked || currentLevel === 1) return;
            playSound('select');
            clearInterval(timer);
            const prize = MONEY_TREE[currentLevel - 2].amount;
            showResult(prize, false);
        }

        function gameOver(reason) {
            let prize = "0 TL";
            if (currentLevel > 12) prize = "1.000.000 TL";
            else if (currentLevel > 7) prize = "150.000 TL";
            else if (currentLevel > 3) prize = "20.000 TL";

            const d = DICTIONARY[currentLang];
            document.getElementById('result-title').innerText = reason;
            document.getElementById('result-icon').innerText = "❌";
            document.getElementById('result-desc').innerText = d.gameOverDesc;
            showResult(prize, false);
        }

        function showResult(prize, isWinner) {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('grid');
            const resScreen = document.getElementById('screen-result');
            resScreen.classList.remove('hidden');

            const d = DICTIONARY[currentLang];
            if (isWinner) {
                document.getElementById('result-title').innerText = d.champion;
                document.getElementById('result-icon').innerText = "🦅🏆🦅";
                document.getElementById('result-desc').innerText = d.champDesc;
                playSound('cheer');
                celebrateBJK(null);
            }

            document.getElementById('result-prize').innerText = prize;
        }

        window.onload = () => {
            updateUI();
        };
    </script>
</body>
</html>
